<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#1a2129"/>
      <stop offset="0.55" stop-color="#2a3140"/>
      <stop offset="1"   stop-color="#3a2518"/>
    </linearGradient>
    <radialGradient id="sol" cx="50%" cy="42%" r="55%">
      <stop offset="0"   stop-color="#ffe6b0"/>
      <stop offset="0.4" stop-color="#ffa14a"/>
      <stop offset="1"   stop-color="#ff6b35"/>
    </radialGradient>
    <linearGradient id="estrada" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f47"/>
      <stop offset="1" stop-color="#15191f"/>
    </linearGradient>
    <clipPath id="quad"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#ceu)"/>

  <g clip-path="url(#quad)">
    <!-- sol -->
    <circle cx="256" cy="190" r="120" fill="url(#sol)"/>

    <!-- montanhas ao fundo -->
    <path d="M-10 248 L80 176 L150 230 L210 186 L256 218 L300 184 L360 230 L430 178 L522 248 L522 300 L-10 300 Z"
          fill="#20262f" opacity="0.92"/>
    <path d="M-10 266 L70 218 L140 260 L210 222 L256 248 L310 220 L380 260 L450 218 L522 268 L522 320 L-10 320 Z"
          fill="#2c333d" opacity="0.85"/>

    <!-- chão -->
    <rect x="0" y="298" width="512" height="214" fill="#171b21"/>

    <!-- estrada em perspectiva -->
    <path d="M198 512 L244 298 L268 298 L314 512 Z" fill="url(#estrada)"/>
    <g fill="#ffd089" opacity="0.9">
      <polygon points="253,316 259,316 259,336 252,336"/>
      <polygon points="251,356 261,356 262,382 249,382"/>
      <polygon points="247,410 265,410 267,446 244,446"/>
      <polygon points="242,480 270,480 273,512 238,512"/>
    </g>
    <!-- bordas claras da estrada -->
    <path d="M244 298 L198 512 L206 512 L250 298 Z" fill="#4a4f57" opacity="0.6"/>
    <path d="M268 298 L314 512 L306 512 L262 298 Z" fill="#4a4f57" opacity="0.6"/>

    <!-- ============ MOTO + PILOTO (silhueta de frente) ============ -->
    <g fill="#0b0e12">
      <!-- sombra no chão -->
      <ellipse cx="256" cy="452" rx="60" ry="12" fill="#000" opacity="0.35"/>

      <!-- pneu dianteiro -->
      <rect x="243" y="398" width="26" height="52" rx="12"/>
      <!-- garfo / suspensão -->
      <rect x="238" y="372" width="7" height="34" rx="3"/>
      <rect x="267" y="372" width="7" height="34" rx="3"/>

      <!-- carenagem / tanque -->
      <path d="M226 372 Q256 350 286 372 L292 400 Q256 388 220 400 Z"/>

      <!-- guidão largo (touring) -->
      <path d="M214 356 L190 344 L194 337 L222 350 Z"/>
      <path d="M298 356 L322 344 L318 337 L290 350 Z"/>
      <!-- retrovisores -->
      <circle cx="192" cy="340" r="6"/>
      <circle cx="320" cy="340" r="6"/>

      <!-- para-brisa -->
      <path d="M236 352 Q256 330 276 352 L276 360 Q256 346 236 360 Z" opacity="0.85"/>

      <!-- piloto: pernas abertas sobre a moto -->
      <path d="M240 388 Q232 420 236 446 L246 446 Q246 416 250 392 Z"/>
      <path d="M272 388 Q280 420 276 446 L266 446 Q266 416 262 392 Z"/>
      <!-- tronco -->
      <path d="M234 350 Q256 300 278 350 L272 378 Q256 368 240 378 Z"/>
      <!-- ombros/braços -->
      <path d="M236 352 L214 352 L214 362 L240 366 Z"/>
      <path d="M276 352 L298 352 L298 362 L272 366 Z"/>
      <!-- capacete -->
      <circle cx="256" cy="312" r="24"/>
    </g>

    <!-- detalhes acesos -->
    <path d="M243 308 q13 -9 26 0 q-13 7 -26 0 Z" fill="#ff8a4c" opacity="0.85"/>  <!-- viseira -->
    <ellipse cx="256" cy="392" rx="9" ry="11" fill="#fff2d6"/>                      <!-- farol -->
    <ellipse cx="256" cy="392" rx="16" ry="18" fill="#ffe6b0" opacity="0.25"/>      <!-- brilho do farol -->
  </g>
</svg>
