<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff5a1f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g filter="url(#sh)">
    <!-- estrada sinuosa (S) centralizada em torno de x=256 -->
    <path d="M232 430
             C232 378 300 376 300 330
             C300 286 212 288 212 242
             C212 206 232 212 256 206"
          fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round"/>
    <path d="M232 430
             C232 378 300 376 300 330
             C300 286 212 288 212 242
             C212 206 232 212 256 206"
          fill="none" stroke="#ff5a1f" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 26"/>
  </g>

  <!-- PARTIDA (base) -->
  <circle cx="232" cy="430" r="27" fill="#fff" filter="url(#sh)"/>
  <circle cx="232" cy="430" r="11" fill="#ff5a1f"/>

  <!-- CHEGADA: pino no topo, ponta tocando (256,206) -->
  <g filter="url(#sh)">
    <path d="M256 206
             C232 176 206 162 206 126
             C206 95 228 74 256 74
             C284 74 306 95 306 126
             C306 162 280 176 256 206 Z" fill="#fff"/>
    <circle cx="256" cy="124" r="19" fill="#ff5a1f"/>
  </g>
</svg>